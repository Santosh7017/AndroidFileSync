name: Fetch Clone Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Accumulate Clone Stats
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TRAFFIC_TOKEN }}
          script: |
            const fs = require('fs');
            const file_path = 'docs/clones.json';

            let data = { total_count: 0, history: {} };
            if (fs.existsSync(file_path)) {
              data = JSON.parse(fs.readFileSync(file_path, 'utf8'));
            }

            if (!data.history) {
              data.history = {};
            }

            const response = await github.request('GET /repos/{owner}/{repo}/traffic/clones', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            if (response.data && response.data.clones) {
              for (const clone of response.data.clones) {
                data.history[clone.timestamp] = clone.count;
              }
            }

            data.total_count = Object.values(data.history).reduce((a, b) => a + b, 0);

            fs.writeFileSync(file_path, JSON.stringify(data, null, 2) + '\n');
            console.log(`Updated clone stats successfully. Total clone count: ${data.total_count}`);

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/clones.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update clone statistics [skip ci]"
            git push
          fi
